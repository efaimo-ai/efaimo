# efaimo test scenario: does the csv-cleanup skill actually help?
# Dry run (no API calls):   npx efaimo test examples/scenario.example.yaml
# Real run (spends tokens): npx efaimo test examples/scenario.example.yaml --live
name: csv-cleanup helps on a messy CSV
skill: ./csv-cleanup
model: claude-sonnet-5
# 8, because that is what the two committed runs in the README used. The dry
# run prints what a plan this size can detect: at 8 per arm nothing under about
# 63 points can reach p < 0.05, so raise it for anything less clear-cut than
# these two. The default when the key is absent is 20.
trials: 8

# The judge defaults to the model above, which means a model grades its own
# answers. Point it somewhere else to remove that. (unreleased: needs 0.2.0)
# judge_model: claude-opus-5
task: |
  Clean this CSV and summarize what you changed:

  name , email ,city
  Ada ,ada@example.com, London
  Ada ,ada@example.com, London
  Grace,grace@example.com ,New York
judge: |
  PASS only if the answer (a) removes the duplicate Ada row, (b) trims the stray
  whitespace around cells, and (c) states the final row count. Otherwise FAIL.
