name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


# Least privilege. This workflow only reads the checkout; it needs nothing
# else, and saying so means a future step cannot quietly acquire more.
permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Node 22 is Maintenance LTS (since 2025-10-21, EOL 2027-04-30) and 24 is
        # Active LTS; Node 20 is EOL and below pnpm's floor. On 2026-10-20 Node 24
        # moves to Maintenance and 26 becomes LTS on 10-28: revisit this matrix then.
        # (This comment said "Node 22 is the active LTS" until 2026-09-02.)
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Nothing in this repo would have said a word about a published advisory.
      # Two were live on 2026-08-02, both in the half of the MCP SDK's tree this
      # CLI never executes (its HTTP server stack: express, hono, cors), and
      # there was no mechanism that could have surfaced them.
      #
      # The threshold was `high` from then until 0.5.0, and the reason was that
      # tree: a moderate confined to code this CLI never runs is a
      # lockfile-refresh chore, not a reason to stop a build. 0.5.0 moved to the
      # 2.x SDK line and that whole stack left with it. Production dependencies
      # went from 30 to 13, the two moderate `qs` advisories went with express,
      # and `pnpm audit --prod` reports nothing at any level.
      #
      # So the threshold drops to `moderate`. It was set to tolerate something
      # that no longer exists, and a threshold nobody re-derives after its
      # reason expires is how a gate quietly stops being one. If this starts
      # failing on a moderate in code we do not execute, argue it back up in
      # this comment rather than in a flag.
      #
      # Runs once, not per matrix cell: the tree is the same on every OS and
      # Node version, and four identical failures is noise.
      - name: audit production dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: pnpm audit --prod --audit-level=moderate
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: dogfood (check own SKILL.md)
        run: node dist/cli.js check --skill ./SKILL.md --strict
      # The composite Action is what Marketplace users install, and it runs the
      # PUBLISHED package rather than this checkout, so it needs its own test:
      # nothing else here would notice if action.yml broke.
      - name: dogfood (run our own Action)
        uses: ./
        with:
          command: check --skill ./SKILL.md --strict
      - name: smoke (weigh a real MCP server)
        shell: bash
        # Network-dependent (npx cold-download + boot); retry so a slow runner is
        # not a red build. The first attempt warms the npx cache for the rest.
        # Pinned version: per-commit CI must be deterministic; news about the
        # reference server's latest belongs to a scheduled run, not to a push.
        run: |
          for i in 1 2 3; do
            node dist/cli.js weigh "npx -y @modelcontextprotocol/server-everything@2026.7.4" --timeout 180 && exit 0
            echo "smoke attempt $i failed; retrying in 5s"; sleep 5
          done
          exit 1
