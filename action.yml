name: "efaimo"
author: "efaimo ai"
description: "Audit MCP servers and Agent Skills for quality and context-window cost"
branding:
  icon: "activity"
  color: "blue"
inputs:
  command:
    description: 'efaimo subcommand and flags, e.g. `check --skill ./skills --strict`. Split on spaces with no quoting, so a server command goes in `target`'
    required: true
  target:
    description: 'what to audit, passed after `command` as ONE argument, spaces and all, e.g. `npx -y my-server` with `command: check --mcp`'
    required: false
    default: ""
  version:
    description: "efaimo version to run (npm dist-tag or version)"
    required: false
    default: "latest"
  working-directory:
    description: "directory to run in"
    required: false
    default: "."
runs:
  using: "composite"
  steps:
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      # Every value goes through env, never into the run: body. A ${{ }}
      # expression inside run: is substituted BEFORE bash sees the script, so
      # `command` was arbitrary code in the consumer's runner, holding the
      # consumer's secrets. Anyone wiring a PR title, branch name, issue body
      # or matrix value into this input (docs/INTEGRATIONS.md recommends this
      # action for CI) was one backtick away from that. This is the published
      # action other people run, so the blast radius was never ours.
      env:
        EFAIMO_VERSION: ${{ inputs.version }}
        EFAIMO_COMMAND: ${{ inputs.command }}
        EFAIMO_TARGET: ${{ inputs.target }}
      # `command` is unquoted on purpose: a subcommand plus flags has to
      # word-split, and it is bash splitting a value it received as data, not
      # the expression engine pasting text into source. Bash does not re-read
      # quotes inside a value, though, so the `weigh "npx -y my-server"` this
      # file used to suggest reached efaimo as three broken words. `target` is
      # passed as one quoted word, and as nothing at all when it is empty.
      # `set -f`: split, but do not expand a `*` against the runner's files.
      run: |
        set -f
        npx -y "efaimo@$EFAIMO_VERSION" $EFAIMO_COMMAND ${EFAIMO_TARGET:+"$EFAIMO_TARGET"}
